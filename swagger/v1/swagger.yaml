---
openapi: 3.0.1
info:
  title: Social Media API
  version: v1
paths:
  "/api/v1/posts":
    get:
      summary: Lists kept posts
      tags:
      - Posts
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: omits soft-deleted posts
        '401':
          description: unauthenticated
    post:
      summary: Creates a post
      tags:
      - Posts
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: created
        '422':
          description: title too long
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    title:
                      type: string
                    body:
                      type: string
                  required:
                  - title
                  - body
              required:
              - post
  "/api/v1/posts/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: Authorization
      in: header
      schema:
        type: string
    get:
      summary: Shows a kept post
      tags:
      - Posts
      security:
      - bearerAuth: []
      responses:
        '200':
          description: found
        '404':
          description: soft-deleted
    patch:
      summary: Updates own post
      tags:
      - Posts
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
        '404':
          description: another user's post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    title:
                      type: string
                    body:
                      type: string
    delete:
      summary: Soft-deletes own post
      tags:
      - Posts
      security:
      - bearerAuth: []
      responses:
        '204':
          description: deleted
  "/api/v1/posts/{post_id}/rating":
    parameters:
    - name: post_id
      in: path
      required: true
      schema:
        type: string
    - name: Authorization
      in: header
      schema:
        type: string
    put:
      summary: Creates or updates the current user's rating
      tags:
      - Ratings
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
        '422':
          description: value out of range
        '400':
          description: missing rating key
        '404':
          description: soft-deleted post
        '401':
          description: unauthenticated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: object
                  properties:
                    value:
                      type: integer
                      minimum: 1
                      maximum: 5
                  required:
                  - value
              required:
              - rating
  "/api/v1/sessions":
    post:
      summary: Creates a session
      tags:
      - Sessions
      parameters: []
      responses:
        '200':
          description: authenticated with username
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: kirby@example.com
                username:
                  type: string
                  example: kirby
                password:
                  type: string
                  example: password123
  "/api/v1/users":
    post:
      summary: Registers a user
      tags:
      - Users
      parameters: []
      responses:
        '201':
          description: created
        '422':
          description: duplicate username or email
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    username:
                      type: string
                      example: kirby
                    email:
                      type: string
                      example: kirby@example.com
                    password:
                      type: string
                      example: password123
                  required:
                  - username
                  - email
                  - password
              required:
              - user
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
